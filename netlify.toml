[build]
  publish = "public"
  command = "npx prisma generate --schema=prisma/production/schema.prisma && npx prisma migrate deploy --schema=prisma/production/schema.prisma"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express", "@prisma/client", ".prisma/client"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true
