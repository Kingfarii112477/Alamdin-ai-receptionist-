version: "3.9"

# Runs the app against PostgreSQL (matching the Dockerfile, which now builds
# against prisma/production/schema.prisma). Includes a local Postgres
# container by default so `docker compose up --build` still works with zero
# external setup. To point at a real hosted Postgres instead (e.g. Neon),
# override DATABASE_URL: `DATABASE_URL="postgresql://..." docker compose up`
# — the bundled `postgres` service is then simply unused.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://alamdin:alamdin@postgres:5432/alamdin_receptionist}
      AI_PROVIDER: ${AI_PROVIDER:-template}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin-key}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alamdin
      POSTGRES_PASSWORD: alamdin
      POSTGRES_DB: alamdin_receptionist
    volumes:
      - alamdin_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  alamdin_postgres_data:
