version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "file:/data/prod.db"
      AI_PROVIDER: ${AI_PROVIDER:-template}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin-key}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - alamdin_db_data:/data
    restart: unless-stopped

  # --- Optional: PostgreSQL for a real production deployment ---------------
  # 1. In prisma/schema.prisma, change datasource provider from "sqlite" to
  #    "postgresql".
  # 2. Uncomment this service and set DATABASE_URL above to:
  #    postgresql://alamdin:alamdin@postgres:5432/alamdin_receptionist
  # 3. Run `docker compose up --build`.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: alamdin
  #     POSTGRES_PASSWORD: alamdin
  #     POSTGRES_DB: alamdin_receptionist
  #   volumes:
  #     - alamdin_postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  alamdin_db_data:
  # alamdin_postgres_data:
